name: BookmarkX
options:
  bundleIdPrefix: com.williamyang
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  knownRegions:
    - en
    - zh-Hans
    - Base
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    ENABLE_TESTABILITY: YES
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
targets:
  BookmarkX:
    type: application
    platform: macOS
    sources:
      - path: Sources/BookmarkX
        excludes:
          - Resources
      - path: Sources/BookmarkX/Resources
        excludes:
          - BookmarkX.entitlements
          - Info.plist
        buildPhase: resources
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.williamyang.BookmarkX
        PRODUCT_NAME: BookmarkX
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/BookmarkX/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/BookmarkX/Resources/BookmarkX.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BookmarkXTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BookmarkXTests
    dependencies:
      - target: BookmarkX
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.williamyang.BookmarkXTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BookmarkX.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BookmarkX"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  BookmarkX:
    build:
      targets:
        BookmarkX: all
        BookmarkXTests: [test]
    test:
      targets:
        - BookmarkXTests
    run:
      config: Debug
